<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X Bookmarks</title><meta name="color-scheme" content="dark light">
<style>
:root{--bg:#000;--panel:#0c0c0e;--card:#111114;--card2:#16161a;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#6e6e73;--blue:#2997ff;--blueBg:rgba(41,151,255,.14);--r:14px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#f5f5f7;--panel:#fff;--card:#fff;--card2:#fafafa;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#86868b;--blue:#0071e3;--blueBg:rgba(0,113,227,.1)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,3vw,32px) 80px}
h1{font-size:clamp(30px,4.4vw,44px);letter-spacing:-.025em;font-weight:700;margin:0 0 6px}
.sub{color:var(--fg2);font-size:15px;margin:0 0 28px}
h2{font-size:24px;letter-spacing:-.02em;font-weight:700;margin:44px 0 16px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.metric b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.metric span{color:var(--fg2);font-size:13px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:600}
.bar{display:grid;grid-template-columns:minmax(0,1.1fr) 1fr 34px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0;color:var(--fg2);cursor:pointer;border-radius:6px}
.bar:hover{color:var(--fg)}.bar i{height:4px;border-radius:4px;background:var(--line);overflow:hidden;display:block}.bar i u{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}.bar s{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;align-items:end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--fg2);font-weight:500}
select,input[type=search],input[type=text]{appearance:none;background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:9px;height:34px;padding:0 10px;font:inherit;font-size:13.5px;width:100%}
select{background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
select:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blueBg)}
.toggles{display:flex;gap:16px;align-items:center;height:34px}.tg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg2);cursor:pointer;user-select:none}
.tg input{display:none}.tg span{width:34px;height:20px;border-radius:20px;background:var(--line2);position:relative;transition:.2s}.tg span:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg input:checked+span{background:#30d158}.tg input:checked+span:after{left:16px}
.sortrow{display:flex;gap:20px;align-items:center;margin:18px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sortrow button.s{background:none;border:0;color:var(--fg2);font:inherit;font-size:13.5px;padding:10px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.sortrow button.s.on{color:var(--fg);border-color:var(--fg);font-weight:600}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.count{color:var(--fg3);font-size:12.5px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 12px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .18s ease,border-color .18s,box-shadow .18s;text-align:left;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.card:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.25)}.card:active{transform:scale(.985)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.au{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{font-size:11px;color:var(--fg2);border:1px solid var(--line2);border-radius:999px;padding:2px 8px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.hd{font-weight:650;font-size:14.5px;line-height:1.35;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;color:var(--fg2);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.chip.pj{color:var(--blue);background:var(--blueBg);border-color:transparent}.chip.pj:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.tk{color:var(--fg2);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:grid;gap:3px;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:var(--card2)}.thumbs.n2{grid-template-columns:1fr 1fr}.thumbs.n3,.thumbs.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.thumbs.n3 .th:first-child{grid-row:span 2}
.th{position:relative;overflow:hidden;background:var(--card2)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center}.play:after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.ft{display:flex;gap:10px;color:var(--fg3);font-size:11.5px;margin-top:auto;font-variant-numeric:tabular-nums;align-items:center}.ft .fv{margin-left:auto;color:#ffd60a}
.more{display:block;margin:22px auto 0}
.about{color:var(--fg2);font-size:13.5px;max-width:760px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .28s;z-index:50}.scrim.on{opacity:1}
.sheet{position:fixed;z-index:51;background:var(--panel);color:var(--fg);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid var(--line)}
@media (max-width:719px){.sheet{left:0;right:0;bottom:0;max-height:92vh;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom)}.sheet.on{transform:translateY(0)}}
@media (min-width:720px){.sheet{left:50%;top:50%;width:min(680px,92vw);max-height:86vh;border-radius:18px;transform:translate(-50%,-48%) scale(.97);opacity:0;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .2s}.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}.grab{display:none!important}}
.grab{padding:8px 0 2px;display:grid;place-items:center;touch-action:none;cursor:grab}.grab i{width:36px;height:5px;border-radius:3px;background:var(--line2)}
.shead{display:flex;align-items:center;gap:10px;padding:10px 18px 12px;border-bottom:1px solid var(--line);touch-action:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--blueBg);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.shead .who{flex:1;min-width:0}.shead .who b{display:block;font-size:15px}.shead .who span{font-size:12.5px;color:var(--fg3)}
.x{width:30px;height:30px;border-radius:50%;border:0;background:var(--card2);color:var(--fg2);font-size:16px;cursor:pointer;flex:none}
.sbody{overflow-y:auto;padding:16px 18px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.stitle{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0 0 10px}
.stext{white-space:pre-wrap;font-size:15.5px;line-height:1.55;word-wrap:break-word}
.smedia{display:flex;flex-direction:column;gap:8px;margin:14px 0}.smedia img,.smedia video{width:100%;border-radius:12px;display:block;background:var(--card2);max-height:70vh;object-fit:contain}
.vfb{position:relative;display:block}.vfb .play{width:56px;height:56px}
.tkbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px}.tkbox small{display:block;color:var(--fg3);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.stats{display:flex;gap:16px;color:var(--fg3);font-size:13px;margin:10px 0;font-variant-numeric:tabular-nums}
.sfoot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.cta{flex:1;display:block;text-align:center;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:600;font-size:15px;padding:12px;border-radius:12px}
body.lock{overflow:hidden}
@media (max-width:719px){.metrics{grid-template-columns:repeat(2,1fr)}.bars{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
<h1>X Bookmarks</h1><p class="sub" id="sub"></p>
<div class="metrics" id="metrics"></div>
<div class="bars" id="bars"></div>
<h2>Browse</h2>
<div class="filters">
<label class="f">Category<select id="fc"></select></label><label class="f">Purpose<select id="fp"></select></label>
<label class="f">Project<select id="fj"></select></label><label class="f">Posted<select id="fd"><option value="">Any time</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="180">Last 6 months</option><option value="365">Last year</option><option value="old">Older than a year</option></select></label>
<label class="f">Author<input type="text" id="fa" placeholder="@handle"></label><label class="f">Search<input type="search" id="fs" placeholder="text, takeaway, notes"></label>
<div class="toggles"><label class="tg"><input type="checkbox" id="fm"><span></span>Has media</label><label class="tg"><input type="checkbox" id="ff"><span></span>Favorites</label></div>
</div>
<div class="sortrow" id="sorts"><button class="s on" data-s="o">Recently bookmarked</button><button class="s" data-s="d">Post date</button><button class="s" data-s="l">Likes</button><button class="s" data-s="a">Author</button><button class="btn" id="reset">Reset</button><span class="count" id="count"></span></div>
<div class="grid" id="grid"></div>
<button class="btn more" id="more">Show more</button>
<h2>About</h2><p class="about" id="about"></p>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<script src="data.js"></script>
<script>
(function(){
var B=window.BM||[],$=function(i){return document.getElementById(i)},esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var nf=function(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n)};
var fmtD=function(d){var p=d.split("-");return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
var cnt=function(f){var m={};B.forEach(function(r){[].concat(f(r)).forEach(function(k){if(k)m[k]=(m[k]||0)+1})});return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]})};
var cats=cnt(function(r){return r.c}),purs=cnt(function(r){return r.p}),pjs=cnt(function(r){return r.j});
var minD=B.reduce(function(a,r){return r.d<a?r.d:a},"9999");
$("sub").textContent=B.length.toLocaleString()+" saved posts · back to "+fmtD(minD)+" · synced "+(window.BM_SYNC||"");
$("metrics").innerHTML=[[B.length,"Bookmarks"],[B.filter(function(r){return r.m.length}).length,"With media"],[B.filter(function(r){return r.k=="article"}).length,"Articles"],[new Set(B.map(function(r){return r.a})).size,"Authors"]].map(function(m){return'<div class="metric"><b>'+m[0].toLocaleString()+'</b><span>'+m[1]+'</span></div>'}).join("");
function opts(el,lab,arr){el.innerHTML='<option value="">'+lab+'</option>'+arr.map(function(a){return'<option value="'+esc(a[0])+'">'+esc(a[0])+' ('+a[1]+')</option>'}).join("")}
opts($("fc"),"All categories ("+B.length+")",cats);opts($("fp"),"All",purs);opts($("fj"),"All",pjs);
function barList(t,arr,sel){var mx=arr.length?arr[0][1]:1;return'<div class="panel"><h3>'+t+'</h3>'+arr.slice(0,9).map(function(a){return'<div class="bar" data-sel="'+sel+'" data-v="'+esc(a[0])+'"><s>'+esc(a[0])+'</s><i><u style="width:'+(a[1]/mx*100)+'%"></u></i><em>'+a[1]+'</em></div>'}).join("")+'</div>'}
$("bars").innerHTML=barList("Top categories",cats,"fc")+barList("Purpose",purs,"fp")+barList("Projects",pjs,"fj");
$("bars").addEventListener("click",function(e){var b=e.target.closest(".bar");if(!b)return;$(b.dataset.sel).value=b.dataset.v;lim=24;render();$("grid").scrollIntoView({behavior:"smooth",block:"start"})});
$("about").textContent="Every post Donovin has bookmarked on X ("+B.length.toLocaleString()+", oldest post from "+fmtD(minD)+"). Categories, purpose and project tags are rule-based from the post text; takeaways are the post's lead sentence unless edited. Tap a card to read the whole post here; “Open on X” is inside the sheet. Media streams from X's CDN, so thumbnails and video need a connection.";
var sort="o",lim=24,today=new Date();
function list(){var c=$("fc").value,p=$("fp").value,j=$("fj").value,dd=$("fd").value,a=$("fa").value.replace(/^@/,"").toLowerCase().trim(),q=$("fs").value.toLowerCase().trim(),fm=$("fm").checked,ff=$("ff").checked;
var cut=dd&&dd!="old"?new Date(today-dd*864e5).toISOString().slice(0,10):null,old=dd=="old"?new Date(today-365*864e5).toISOString().slice(0,10):null;
var r=B.filter(function(r){return(!c||r.c==c)&&(!p||r.p.indexOf(p)>=0)&&(!j||r.j.indexOf(j)>=0)&&(!cut||r.d>=cut)&&(!old||r.d<old)&&(!a||r.a.toLowerCase().indexOf(a)>=0)&&(!fm||r.m.length)&&(!ff||r.fav)&&(!q||(r.h+" "+r.x+" "+r.t+" "+r.n+" "+r.a).toLowerCase().indexOf(q)>=0)});
r.sort(sort=="o"?function(x,y){return x.o-y.o}:sort=="d"?function(x,y){return x.d<y.d?1:-1}:sort=="l"?function(x,y){return y.l-x.l}:function(x,y){return x.a.localeCompare(y.a)});return r}
function thumbs(m){if(!m.length)return"";var s=m.slice(0,4);return'<div class="thumbs n'+s.length+'">'+s.map(function(x){return'<div class="th"><img loading="lazy" decoding="async" alt="" src="'+esc(x.img)+(x.img.indexOf("pbs.twimg.com/media")>=0?"?name=small":"")+'">'+(x.t!="photo"?'<span class="play"></span>':"")+'</div>'}).join("")+'</div>'}
var cur=[];
function render(){cur=list();$("count").textContent=cur.length.toLocaleString()+" shown";
$("grid").innerHTML=cur.slice(0,lim).map(function(r,ix){return'<div class="card" role="button" tabindex="0" data-ix="'+ix+'"><div class="top"><span class="au">@'+esc(r.a)+'</span><span class="cat">'+esc(r.c)+'</span></div>'+thumbs(r.m)+'<div class="hd">'+esc(r.h)+'</div><div class="chips">'+r.p.map(function(p){return'<span class="chip">'+esc(p)+'</span>'}).join("")+r.j.map(function(p){return'<span class="chip pj">'+esc(p)+'</span>'}).join("")+'</div>'+(r.t&&r.t!=r.h?'<div class="tk">'+esc(r.t)+'</div>':"")+'<div class="ft"><span>'+fmtD(r.d)+'</span><span>♥ '+nf(r.l)+'</span>'+(r.k=="article"?'<span>Article</span>':"")+(r.fav?'<span class="fv">★</span>':"")+'</div></div>'}).join("");
$("more").style.display=cur.length>lim?"":"none";$("more").textContent="Show more ("+(cur.length-lim).toLocaleString()+" left)"}
["fc","fp","fj","fd","fm","ff"].forEach(function(i){$(i).addEventListener("change",function(){lim=24;render()})});["fa","fs"].forEach(function(i){$(i).addEventListener("input",function(){lim=24;render()})});
$("sorts").addEventListener("click",function(e){var b=e.target.closest("button.s");if(!b)return;sort=b.dataset.s;[].forEach.call(document.querySelectorAll("button.s"),function(x){x.classList.toggle("on",x==b)});render()});
$("reset").onclick=function(){["fc","fp","fj","fd","fa","fs"].forEach(function(i){$(i).value=""});$("fm").checked=$("ff").checked=false;lim=24;render()};
$("more").onclick=function(){lim+=24;render()};
// full text, lazily loaded
var fullReq=false;function needFull(){if(window.BM_FULL||fullReq)return;fullReq=true;var s=document.createElement("script");s.src="full.js";document.body.appendChild(s)}
window.addEventListener("bmfull",function(){if(open)fillText(open)});
var sh=$("sheet"),sc=$("scrim"),open=null,lastFocus=null;
function fillText(r){var el=sh.querySelector(".stext");if(!el)return;var f=window.BM_FULL&&window.BM_FULL[r.i];el.textContent=f||r.x||r.h;}
function media(m){return m.map(function(x){if(x.t=="photo")return'<img alt="" src="'+esc(x.img)+(x.img.indexOf("pbs.twimg.com/media")>=0?"?name=large":"")+'">';if(x.v)return'<video controls playsinline preload="none" poster="'+esc(x.img)+'" src="'+esc(x.v)+'"></video>';return'<a class="vfb" href="https://x.com/i/status/'+open.i+'" target="_blank" rel="noopener"><img alt="" src="'+esc(x.img)+'"><span class="play"></span></a>'}).join("")}
function show(r){open=r;needFull();lastFocus=document.activeElement;
sh.innerHTML='<div class="grab"><i></i></div><div class="shead"><div class="av">'+esc(r.a[0]||"?").toUpperCase()+'</div><div class="who"><b>@'+esc(r.a)+'</b><span>'+fmtD(r.d)+' · '+esc(r.c)+'</span></div><button class="x" aria-label="Close">✕</button></div><div class="sbody">'+(r.k=="article"?'<h3 class="stitle">'+esc(r.h)+'</h3>':"")+'<div class="stext"></div>'+(r.m.length?'<div class="smedia">'+media(r.m)+'</div>':"")+'<div class="stats"><span>♥ '+r.l.toLocaleString()+' likes</span><span>🔖 '+r.b.toLocaleString()+' saves</span>'+(r.k=="article"?'<span>Article</span>':"")+'</div><div class="chips">'+r.p.map(function(p){return'<span class="chip">'+esc(p)+'</span>'}).join("")+r.j.map(function(p){return'<span class="chip pj">'+esc(p)+'</span>'}).join("")+'</div>'+(r.t?'<div class="tkbox"><small>Takeaway</small>'+esc(r.t)+'</div>':"")+(r.n?'<div class="tkbox"><small>Notes</small>'+esc(r.n)+'</div>':"")+'</div><div class="sfoot"><a class="cta" href="https://x.com/'+esc(r.a)+'/status/'+r.i+'" target="_blank" rel="noopener">Open on X ↗</a></div>';
fillText(r);sh.hidden=sc.hidden=false;document.body.classList.add("lock");sh.style.transform="";requestAnimationFrame(function(){sh.classList.add("on");sc.classList.add("on")});sh.querySelector(".x").onclick=close;sh.querySelector(".x").focus();bindDrag()}
function close(){if(!open)return;open=null;sh.classList.remove("on");sc.classList.remove("on");sh.style.transform="";document.body.classList.remove("lock");[].forEach.call(sh.querySelectorAll("video"),function(v){v.pause()});setTimeout(function(){if(!open){sh.hidden=sc.hidden=true;sh.innerHTML=""}},320);if(lastFocus)lastFocus.focus()}
sc.onclick=close;document.addEventListener("keydown",function(e){if(e.key=="Escape")close()});
$("grid").addEventListener("click",function(e){var c=e.target.closest(".card");if(c)show(cur[+c.dataset.ix])});
$("grid").addEventListener("keydown",function(e){var c=e.target.closest(".card");if(c&&(e.key=="Enter"||e.key==" ")){e.preventDefault();show(cur[+c.dataset.ix])}});
function bindDrag(){var y0=null,dy=0,body=sh.querySelector(".sbody");
function start(e){if(window.innerWidth>=720)return;if(e.currentTarget==body&&body.scrollTop>0)return;y0=e.clientY;dy=0;sh.style.transition="none"}
function move(e){if(y0==null)return;dy=Math.max(0,e.clientY-y0);if(dy>0){sh.style.transform="translateY("+dy+"px)";sc.style.opacity=String(1-Math.min(dy/400,.8))}}
function end(){if(y0==null)return;y0=null;sh.style.transition="";sc.style.opacity="";if(dy>110)close();else sh.style.transform=""}
[sh.querySelector(".grab"),sh.querySelector(".shead"),body].forEach(function(el){el.addEventListener("pointerdown",start);});
window.onpointermove=move;window.onpointerup=end;window.onpointercancel=end}
render();
})();
</script></body></html>
